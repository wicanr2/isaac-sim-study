# D-3:MPPI 對 DWB。controller_server 的 FollowPath 換成 MPPI;疊在 nav2_params.yaml 之後(CONTROLLER=mppi)。
# 數值照 Nav2 Jazzy nav2_bringup/params/nav2_params.yaml(ros-navigation/navigation2 jazzy 分支,2026-09-17 取)的 FollowPath 段,
# 只改速度/加速度上限對齊 DWB(nav2_params.yaml)與韌體斜坡(1.5 m/s²、4 rad/s²)、關掉視覺化;其他不調(不做參數最佳化)。
controller_server:
  ros__parameters:
      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 56
        model_dt: 0.05
        batch_size: 2000
        ax_max: 1.5   # bringup 3.0;對齊 DWB 與韌體斜坡
        ax_min: -1.5   # bringup -3.0;對齊 DWB 與韌體斜坡
        ay_max: 3.0
        ay_min: -3.0
        az_max: 4.0   # bringup 3.5;對齊 DWB 與韌體斜坡
        vx_std: 0.2
        vy_std: 0.2
        wz_std: 0.4
        vx_max: 0.3   # bringup 0.5;對齊 DWB 與韌體斜坡
        vx_min: 0.0   # bringup -0.35;對齊 DWB 與韌體斜坡
        vy_max: 0.5
        wz_max: 0.6   # bringup 1.9;對齊 DWB 與韌體斜坡
        iteration_count: 1
        prune_distance: 1.7
        transform_tolerance: 0.1
        temperature: 0.3
        gamma: 0.015
        motion_model: "DiffDrive"
        visualize: false   # bringup true;headless 不發視覺化 topic
        regenerate_noises: true
        TrajectoryVisualizer:
          trajectory_step: 5
          time_step: 3
        AckermannConstraints:
          min_turning_r: 0.2
        critics: [
          "ConstraintCritic", "CostCritic", "GoalCritic",
          "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
          "PathAngleCritic", "PreferForwardCritic"]
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 4.0
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 1.4
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.5
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 0.5
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.81
          near_collision_cost: 253
          critical_cost: 300.0
          consider_footprint: false
          collision_cost: 1000000.0
          near_goal_distance: 1.0
          trajectory_point_step: 2
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 14.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 4
          threshold_to_consider: 0.5
          offset_from_furthest: 20
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 1.4
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 2.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.0
          mode: 0
        # TwirlingCritic:
        #   enabled: true
        #   twirling_cost_power: 1
        #   twirling_cost_weight: 10.0
  
