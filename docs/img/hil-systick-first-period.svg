<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">同一個 SysTick,兩種暫存器寫入順序:一支韌體 1 ms 起跳,另一支第一個週期 233 ms</text>
  <defs>
    <marker id="kGry" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#888"/></marker>
  </defs>

  <!-- 左:裸機順序 -->
  <rect x="40" y="50" width="390" height="92" rx="8" fill="#e8f3ec" stroke="#2e7d4f"/>
  <text x="235" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f5236">裸機版:CTRL=0 → LOAD=71999 → CVR=0 → CTRL=7</text>
  <text x="235" y="94" text-anchor="middle" font-size="11" fill="#1f5236">寫 CVR 時 RELOAD 已非零 → Renode 載入 71999</text>
  <text x="235" y="112" text-anchor="middle" font-size="11" fill="#1f5236">啟用後 10 µs 讀 CVR = 0x1166F(71279),正確</text>
  <text x="235" y="130" text-anchor="middle" font-size="10.5" fill="#2e7d4f" font-family="monospace">probe_systick.resc S2</text>
  <!-- 右:FreeRTOS 順序 -->
  <rect x="430" y="50" width="390" height="92" rx="8" fill="#fbe3e0" stroke="#b03a2e"/>
  <text x="625" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a1f16">FreeRTOS port:CTRL=0 → CVR=0 → LOAD=71999 → CTRL=7</text>
  <text x="625" y="94" text-anchor="middle" font-size="11" fill="#7a1f16">寫 CVR 時 RELOAD 還是 0 → 什麼都沒載;ENABLE 0→1 也不載</text>
  <text x="625" y="112" text-anchor="middle" font-size="11" fill="#7a1f16">啟用後 10 µs 讀 CVR = 0xFFFD2F,從 0xFFFFFF 往下數</text>
  <text x="625" y="130" text-anchor="middle" font-size="10.5" fill="#b03a2e" font-family="monospace">probe_systick.resc S1</text>

  <!-- 計數器軌跡 -->
  <text x="40" y="172" font-size="12" font-weight="bold" fill="#333">CVR 隨時間(72 MHz;縱軸不等比)</text>
  <line x1="80" y1="330" x2="800" y2="330" stroke="#888" marker-end="url(#kGry)"/>
  <line x1="80" y1="330" x2="80" y2="190" stroke="#888"/>
  <text x="70" y="200" text-anchor="end" font-size="10.5" fill="#555">2^24</text>
  <text x="70" y="290" text-anchor="end" font-size="10.5" fill="#555">71999</text>
  <text x="70" y="334" text-anchor="end" font-size="10.5" fill="#555">0</text>
  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="80" y="348">0</text><text x="700" y="348">233 ms</text><text x="800" y="348">t</text>
  </g>
  <!-- 綠:鋸齒 1 ms -->
  <path d="M80,290 L86,330 L86,290 L92,330 L92,290 L98,330 L98,290 L104,330 L104,290 L110,330 L110,290 L116,330 L116,290 L122,330 L122,290 L128,330 L128,290 L134,330 L134,290 L140,330 L140,290 L146,330 L146,290 L152,330" fill="none" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="160" y="300" font-size="10.5" fill="#2e7d4f">每 1 ms 一次 tick,FreeRTOS 的排程器從第 1 ms 就在走</text>
  <!-- 紅:一條長斜線 -->
  <path d="M80,196 L700,330 L706,290 L712,330 L718,290 L724,330" fill="none" stroke="#b03a2e" stroke-width="1.5"/>
  <text x="400" y="238" text-anchor="middle" font-size="10.5" fill="#b03a2e">第一個週期 2^24 個 cycle = 233 ms:CPU 在 idle hook 的 WFI,沒有任何中斷叫醒它</text>
  <text x="400" y="254" text-anchor="middle" font-size="10.5" fill="#b03a2e">(2 ms → 222 ms 指令數一條都沒增加;252 ms 才 tick 15)</text>
  <text x="712" y="280" text-anchor="middle" font-size="10.5" fill="#b03a2e">之後正常 1 kHz</text>

  <!-- 底:修在哪 -->
  <rect x="40" y="368" width="780" height="56" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="60" y="390" font-size="11.5" fill="#333">ARMv7-M B3.3.3:ENABLE 由 0 變 1 時計數器從 SYST_RVR 載入。port.c 是第三方碼、在硬體上正確,韌體不改;</text>
  <text x="60" y="410" font-size="11.5" fill="#333">修在 Renode NVIC.cs(ENABLE 0→1 加一次 LoadReloadValue()),NUnit 兩種順序:原版 1/2 紅、修正版 2/2 綠。修之前 run_loop 對 FreeRTOS 版開機等 400 ms。</text>
</svg>
