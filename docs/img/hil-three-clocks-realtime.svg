<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">realtime 模式:Renode 跟不上牆鐘時,車安靜地變慢,一致性判準全綠,只有物理量判準 C9 紅</text>
  <defs>
    <marker id="cGry" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#888"/></marker>
    <marker id="cRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b03a2e"/></marker>
  </defs>

  <!-- ===== 左:三個時鐘,6 s 牆鐘 ===== -->
  <text x="40" y="58" font-size="13" font-weight="bold" fill="#333">6 s 牆鐘裡三個時鐘各走多遠(pwm_prescaler 0,10 kHz 載波;主機閒時 load 5.7,Renode 容器 4 核)</text>
  <!-- 軸 -->
  <line x1="150" y1="200" x2="640" y2="200" stroke="#888" stroke-width="1" marker-end="url(#cGry)"/>
  <text x="648" y="204" font-size="11" fill="#888">牆鐘 s</text>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="150" y="216">0</text><text x="230" y="216">1</text><text x="310" y="216">2</text><text x="390" y="216">3</text><text x="470" y="216">4</text><text x="550" y="216">5</text><text x="630" y="216">6</text>
  </g>
  <!-- 牆鐘 / plant -->
  <text x="140" y="90" text-anchor="end" font-size="12" fill="#333">牆鐘(橋接)</text>
  <rect x="150" y="80" width="480" height="14" fill="#e6e6e6" stroke="#888"/>
  <text x="636" y="91" font-size="10.5" fill="#333">6.005 s</text>
  <text x="140" y="120" text-anchor="end" font-size="12" fill="#2e7d4f">受控體時間</text>
  <rect x="150" y="110" width="480" height="14" fill="#e8f3ec" stroke="#2e7d4f"/>
  <text x="636" y="121" font-size="10.5" fill="#2e7d4f">6.003 s(走實際 dt)</text>
  <text x="140" y="150" text-anchor="end" font-size="12" fill="#b03a2e">Renode 虛擬時間</text>
  <rect x="150" y="140" width="410" height="14" fill="#fbe3e0" stroke="#b03a2e"/>
  <text x="566" y="151" font-size="10.5" fill="#b03a2e">5.123 s → ratio 0.853</text>
  <text x="140" y="180" text-anchor="end" font-size="12" fill="#b03a2e">韌體看到的「5 ms」</text>
  <!-- 5 ms window vs 11 ms wall -->
  <rect x="150" y="170" width="48" height="14" fill="#fff" stroke="#b03a2e" stroke-dasharray="3 2"/>
  <text x="204" y="181" font-size="10.5" fill="#b03a2e">= 5.9 ms 牆鐘的編碼器增量(平均;驅動段更慢,max_lag 2.1 s)→ 量到的輪速膨脹 → PI 壓低 duty → 車走一半</text>

  <!-- ===== 右上:末端位姿 ===== -->
  <text x="40" y="256" font-size="13" font-weight="bold" fill="#333">同一腳本(0.5 s 起 300 mm/s 走 3 s,再 600 mrad/s 轉 1.5 s)的末端 x</text>
  <g font-size="11">
    <text x="150" y="286" text-anchor="end" fill="#333">lockstep(參考)</text>
    <rect x="158" y="276" width="450" height="14" fill="#f4f7fb" stroke="#5b7fa6"/>
    <text x="614" y="287" fill="#333">900.8 mm,θ 0.8627</text>
    <text x="150" y="312" text-anchor="end" fill="#333">realtime 10 kHz,0.85×</text>
    <rect x="158" y="302" width="224" height="14" fill="#fbe3e0" stroke="#b03a2e"/>
    <text x="388" y="313" fill="#b03a2e">448.4 mm,θ 0.6467 —— C1–C8 全綠 + [warn],C9 紅</text>
    <text x="150" y="338" text-anchor="end" fill="#333">realtime 1 kHz,1.01×</text>
    <rect x="158" y="328" width="452" height="14" fill="#e8f3ec" stroke="#2e7d4f"/>
    <text x="613" y="339" fill="#2e7d4f">900.1–907.9 mm,θ 0.852–0.864(五次,C9 全紅)</text>
  </g>
  <text x="40" y="366" font-size="11" fill="#555">位置是編碼器 tick 積分出來的,與時間無關,所以 odom 對真值仍在容差內;壞掉的是速度,判準看不到。</text>

  <!-- ===== 下:自由跑速度對 PWM 事件率 ===== -->
  <text x="40" y="402" font-size="13" font-weight="bold" fill="#333">拖慢 Renode 的不是指令(CPU 都在 WFI),是 TIM3 PWM 的事件率</text>
  <g font-size="11">
    <text x="60" y="428" fill="#333">10 kHz 載波 × 3 個 LimitTimer = 每秒 3 萬個 C# 事件</text>
    <text x="60" y="448" fill="#333">自由跑 3 s 牆鐘,量子 100 µs / 1 ms / 10 ms:</text>
    <text x="340" y="448" fill="#b03a2e" font-family="monospace">0.55× / 0.75× / 0.73×</text>
    <text x="60" y="468" fill="#333">同一支韌體,執行期把 ARR 改 0xFFFF(152 Hz):</text>
    <text x="340" y="468" fill="#2e7d4f" font-family="monospace">1.17×</text>
    <text x="60" y="488" fill="#333">calib pwm_prescaler 9(1 kHz),接上橋接:</text>
    <text x="340" y="488" fill="#2e7d4f" font-family="monospace">1.01×</text>
  </g>
  <line x1="560" y1="415" x2="560" y2="500" stroke="#ddd"/>
  <g font-size="11" fill="#555">
    <text x="575" y="428">Renode 追牆鐘以量子為單位,</text>
    <text x="575" y="446">虛擬時間會領先:量到 +1.3%(100 µs)</text>
    <text x="575" y="464">到 +1.8%(1 ms)。C1 在 realtime 下</text>
    <text x="575" y="482">驗「0 &lt; Renode 時間 ≤ 牆鐘 + 5%」。</text>
  </g>
  <text x="430" y="530" text-anchor="middle" font-size="11" fill="#888">數字:35 篇 §5.1,2026-09-17 主機閒時(load 3.6–5.7),Renode 1.16.1 docker 4 核(2 核會被 CFS 每 100 ms 凍 50 ms);ratio 隨負載變,橋接每次印 [clocks]。</text>
</svg>
