<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="820" height="480" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Joint drive = PD 控制:剛度(P)追誤差、阻尼(D)煞速度</text>

  <!-- formula banner (top, own space) -->
  <rect x="20" y="42" width="780" height="56" rx="8" fill="#fff3e6" stroke="#e8853d" stroke-width="1.5"/>
  <text x="410" y="65" text-anchor="middle" font-size="15" fill="#b35c1e" font-weight="bold">F = ks · (q_target − q) + kd · (v_target − v)</text>
  <text x="410" y="86" text-anchor="middle" font-size="11" fill="#b35c1e">位置誤差項(P)負責「往目標拉」;速度誤差項(D)負責「別衝過頭」——兩者獨立可調</text>

  <!-- Left: spring-damper schematic -->
  <g>
    <text x="150" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">關節模型</text>
    <rect x="20" y="134" width="280" height="140" rx="10" fill="#f9fbfd" stroke="#ddd"/>
    <circle cx="70" cy="200" r="16" fill="#eef3fa" stroke="#5b7fa6" stroke-width="2"/>
    <text x="70" y="204" text-anchor="middle" font-size="10" fill="#33506b">q</text>
    <path d="M92,185 L102,185 L108,175 L118,195 L128,175 L138,195 L148,175 L158,185 L168,185" fill="none" stroke="#e8853d" stroke-width="2"/>
    <text x="130" y="167" text-anchor="middle" font-size="11" fill="#b35c1e">ks(剛度)</text>
    <rect x="102" y="207" width="50" height="16" fill="none" stroke="#5a9367" stroke-width="2"/>
    <line x1="127" y1="207" x2="127" y2="238" stroke="#5a9367" stroke-width="2"/>
    <text x="127" y="234" text-anchor="middle" font-size="11" fill="#2e7d4f">kd(阻尼)</text>
    <circle cx="230" cy="200" r="6" fill="#e8853d"/>
    <text x="230" y="183" text-anchor="middle" font-size="11" fill="#b35c1e">目標 q_target</text>
    <line x1="168" y1="200" x2="215" y2="200" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="150" y="258" text-anchor="middle" font-size="11" fill="#888">彈簧拉向目標、阻尼吃掉速度</text>
  </g>

  <!-- gotcha box -->
  <rect x="20" y="286" width="280" height="172" rx="8" fill="#fff3e6" stroke="#e8853d" stroke-width="1.5"/>
  <text x="30" y="308" font-size="11.5" fill="#b35c1e" font-weight="bold">實戰坑:沒設 stiffness/damping</text>
  <text x="30" y="328" font-size="11" fill="#555">joint 沒帶 drive 增益時,對它送</text>
  <text x="30" y="344" font-size="11" fill="#555">apply_action 目標形同沒發生——</text>
  <text x="30" y="360" font-size="11" fill="#555">上式 ks=kd=0,F 恆為 0,不報錯</text>
  <text x="30" y="376" font-size="11" fill="#555">但也絕不會動。「命令發了車不動」</text>
  <text x="30" y="392" font-size="11" fill="#555">十次有八次是漏設這組增益。</text>
  <text x="30" y="416" font-size="10.5" fill="#999">另一條路(set_joint_positions/</text>
  <text x="30" y="430" font-size="10.5" fill="#999">teleport)完全繞過這條 F 的計算——</text>
  <text x="30" y="444" font-size="10.5" fill="#999">見下節「teleport 對 solver 的衝突」</text>

  <!-- right: response curves -->
  <g>
    <text x="560" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">同一個 ks,不同 kd:三種收斂行為</text>
    <rect x="320" y="134" width="480" height="302" rx="10" fill="#f9fbfd" stroke="#ddd"/>
    <!-- axes -->
    <line x1="360" y1="340" x2="760" y2="340" stroke="#999" stroke-width="1.2"/>
    <line x1="360" y1="182" x2="360" y2="340" stroke="#999" stroke-width="1.2"/>
    <text x="760" y="356" text-anchor="end" font-size="10" fill="#888">時間 →</text>
    <text x="352" y="188" text-anchor="end" font-size="10" fill="#888">q</text>
    <line x1="360" y1="217" x2="760" y2="217" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="765" y="221" font-size="10" fill="#999">目標值</text>

