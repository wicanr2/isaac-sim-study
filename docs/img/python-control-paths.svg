<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">不碰 UI 的三條 Python 控制路徑</text>

  <!-- Isaac Sim box -->
  <rect x="500" y="60" width="230" height="270" rx="12" fill="#fff3e6" stroke="#e8853d" stroke-width="2"/>
  <text x="615" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#b35c1e">Isaac Sim(headless)</text>
  <rect x="520" y="105" width="190" height="46" rx="8" fill="#ffffff" stroke="#e8853d"/>
  <text x="615" y="124" text-anchor="middle" font-size="12" fill="#b35c1e">omni.* / isaacsim.* / pxr</text>
  <text x="615" y="142" text-anchor="middle" font-size="11" fill="#b35c1e">完整 Python API</text>
  <rect x="520" y="163" width="190" height="46" rx="8" fill="#ffffff" stroke="#e8853d"/>
  <text x="615" y="182" text-anchor="middle" font-size="12" fill="#b35c1e">場景 Stage(USD)</text>
  <text x="615" y="200" text-anchor="middle" font-size="11" fill="#b35c1e">prim、相機、ScriptNode</text>
  <rect x="520" y="221" width="190" height="46" rx="8" fill="#ffffff" stroke="#e8853d"/>
  <text x="615" y="240" text-anchor="middle" font-size="12" fill="#b35c1e">物理迴圈(PhysX)</text>
  <text x="615" y="258" text-anchor="middle" font-size="11" fill="#b35c1e">physics step callback</text>
  <rect x="520" y="279" width="190" height="38" rx="8" fill="#ffffff" stroke="#e8853d"/>
  <text x="615" y="302" text-anchor="middle" font-size="12" fill="#b35c1e">carb settings 設定樹</text>

  <!-- path 1 -->
  <rect x="30" y="60" width="230" height="72" rx="10" fill="#f4f7fb" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="145" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b">① --exec 啟動腳本</text>
  <text x="145" y="104" text-anchor="middle" font-size="11" fill="#666">開場景 open_stage() + play()</text>
  <text x="145" y="121" text-anchor="middle" font-size="11" fill="#666">初始化相機、設定、命令通道</text>
  <line x1="260" y1="96" x2="497" y2="128" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- path 2 -->
  <rect x="30" y="160" width="230" height="72" rx="10" fill="#f4f7fb" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="145" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b">② ScriptNode(場景內)</text>
  <text x="145" y="204" text-anchor="middle" font-size="11" fill="#666">setup / compute / cleanup</text>
  <text x="145" y="221" text-anchor="middle" font-size="11" fill="#666">腳本存在 USD 裡,隨場景走</text>
  <line x1="260" y1="196" x2="497" y2="188" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- path 3 -->
  <rect x="30" y="260" width="230" height="72" rx="10" fill="#f4f7fb" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="145" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b">③ UDP 命令通道</text>
  <text x="145" y="304" text-anchor="middle" font-size="11" fill="#666">外部送 JSON {"cmd": ...}</text>
  <text x="145" y="321" text-anchor="middle" font-size="11" fill="#666">切視角 / 隱藏 prim / 改設定</text>
  <line x1="260" y1="296" x2="497" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="380" y="350" text-anchor="middle" font-size="11" fill="#888">③ 由 ① 的腳本掛上:physics step 內非阻塞收 UDP → 分派 cmd</text>
</svg>
