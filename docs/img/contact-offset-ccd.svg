<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">碰撞偵測的兩道「距離／時間緩衝」:contact/rest offset 與 CCD</text>

  <!-- Panel A: contact/rest offset -->
  <g>
    <text x="200" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">A. 空間緩衝:contact offset / rest offset</text>
    <rect x="20" y="70" width="360" height="260" rx="10" fill="#f9fbfd" stroke="#ddd"/>

    <!-- target box with three shells -->
    <rect x="140" y="150" width="120" height="80" fill="#eef3fa" stroke="none"/>
    <!-- contact offset shell (outer, dashed) -->
    <rect x="120" y="130" width="160" height="120" rx="4" fill="none" stroke="#e8853d" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- true surface -->
    <rect x="140" y="150" width="120" height="80" fill="none" stroke="#5b7fa6" stroke-width="2.5"/>
    <!-- rest offset shell (inner, shrink) -->
    <rect x="150" y="160" width="100" height="60" rx="2" fill="none" stroke="#5a9367" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- approaching sphere -->
    <circle cx="80" cy="190" r="14" fill="#ffffff" stroke="#888" stroke-width="2"/>
    <line x1="94" y1="190" x2="118" y2="190" stroke="#999" stroke-width="1.5" marker-end="url(#arrG)"/>

    <text x="200" y="270" text-anchor="middle" font-size="11" fill="#b35c1e">橘虛線 = contact offset:進入這圈就開始算接觸約束</text>
    <text x="200" y="286" text-anchor="middle" font-size="11" fill="#5a9367">綠虛線 = rest offset:允許的「休息間隙」,可縮放實際碰撞體積</text>
    <text x="200" y="302" text-anchor="middle" font-size="11" fill="#5b7fa6">藍實線 = 視覺網格的真實表面</text>

    <rect x="34" y="308" width="332" height="16" fill="none"/>
    <text x="200" y="320" text-anchor="middle" font-size="10.5" fill="#888">offset 太大→約束變多、變貴;offset 太小→偵測太晚→抖動或穿透</text>
  </g>

  <!-- Panel B: CCD -->
  <g>
    <text x="615" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">B. 時間緩衝:高速穿透與 CCD</text>
    <rect x="440" y="70" width="360" height="260" rx="10" fill="#f9fbfd" stroke="#ddd"/>

    <!-- without CCD -->
    <text x="620" y="92" text-anchor="middle" font-size="12" fill="#b03a2e" font-weight="bold">沒開 CCD</text>
    <line x1="470" y1="150" x2="770" y2="150" stroke="#999" stroke-width="3"/>
    <text x="775" y="154" font-size="10" fill="#888">平台</text>
    <circle cx="500" cy="118" r="10" fill="#fbe3e0" stroke="#b03a2e" stroke-width="2"/>
    <text x="500" y="105" text-anchor="middle" font-size="10" fill="#b03a2e">t0(平台上方)</text>
    <circle cx="700" cy="182" r="10" fill="#fbe3e0" stroke="#b03a2e" stroke-width="2"/>
    <text x="700" y="205" text-anchor="middle" font-size="10" fill="#b03a2e">t1(已穿到平台下方)</text>
    <line x1="500" y1="118" x2="700" y2="182" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
    <text x="600" y="240" text-anchor="middle" font-size="10.5" fill="#888">單一 timestep 內整段路徑沒被離散取樣點碰到 → 完全穿過,無接觸產生</text>

    <!-- with CCD -->
    <text x="620" y="262" text-anchor="middle" font-size="12" fill="#2e7d4f" font-weight="bold">開 CCD(sweep test)</text>
    <line x1="470" y1="300" x2="770" y2="300" stroke="#999" stroke-width="3"/>
    <circle cx="500" cy="268" r="10" fill="#e7f5ec" stroke="#2e7d4f" stroke-width="2"/>
    <path d="M500,268 Q600,268 620,296" fill="none" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="2,2"/>
    <circle cx="622" cy="296" r="10" fill="#e7f5ec" stroke="#2e7d4f" stroke-width="2.5"/>
    <text x="700" y="292" font-size="10" fill="#2e7d4f">掃掠測試中途攔到接觸,擋在平台上</text>
  </g>

  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#999"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b03a2e"/></marker>
  </defs>

  <rect x="20" y="345" width="780" height="42" rx="8" fill="#fff3e6" stroke="#e8853d" stroke-width="1.5"/>
  <text x="410" y="362" text-anchor="middle" font-size="11.5" fill="#b35c1e">兩者都是「用緩衝換取正確性」:offset 補空間離散化的誤差,CCD 補時間離散化的誤差;都要付運算成本,預設不對所有物件開啟</text>
  <text x="410" y="378" text-anchor="middle" font-size="10.5" fill="#999">薄板(如棧板)常見:convex hull 對薄形近似差,contact offset 沒抓好時最容易看到抖動或誤穿</text>
</svg>
