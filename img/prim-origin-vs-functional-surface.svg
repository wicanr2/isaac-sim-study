<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="cu" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#b35c1e"/>
    </marker>
    <marker id="cd" markerWidth="8" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M8,0 L0,3.5 L8,7 z" fill="#b35c1e"/>
    </marker>
  </defs>
  <rect width="820" height="390" fill="#ffffff"/>

  <text x="410" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">prim 原點不是功能面:原點差 6 mm,承載面差 75 mm</text>
  <text x="410" y="48" text-anchor="middle" font-size="11.5" fill="#888">同一個場景裡兩台高度不同的嵌套板車,縱向 1 px ≈ 1 mm</text>

  <!-- reference height lines -->
  <line x1="70" y1="110.9" x2="600" y2="110.9" stroke="#5a9367" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="70" y1="182.9" x2="600" y2="182.9" stroke="#5a9367" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="70" y1="264.5" x2="600" y2="264.5" stroke="#b7c3cf" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="70" y1="270.2" x2="600" y2="270.2" stroke="#b7c3cf" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- trolley A -->
  <text x="185" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">上層板車</text>
  <rect x="105" y="110.9" width="160" height="10" fill="#5b9bd5" stroke="#2e6da4" stroke-width="1.2"/>
  <rect x="112" y="120.9" width="12" height="150" fill="#8fb8dd" stroke="#2e6da4" stroke-width="1"/>
  <rect x="246" y="120.9" width="12" height="150" fill="#8fb8dd" stroke="#2e6da4" stroke-width="1"/>
  <line x1="178" y1="258.5" x2="192" y2="270.5" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="192" y1="258.5" x2="178" y2="270.5" stroke="#c0392b" stroke-width="1.6"/>
  <text x="185" y="292" text-anchor="middle" font-size="10.5" fill="#c0392b">prim 原點 z = 0.987</text>
  <text x="105" y="106" font-size="10.5" fill="#2e6da4">承載面 z = 1.147</text>
  <line x1="88" y1="110.9" x2="88" y2="264.5" stroke="#b35c1e" stroke-width="1.4" marker-start="url(#cd)" marker-end="url(#cu)"/>
  <text x="80" y="192" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b35c1e">160 mm</text>

  <!-- trolley B -->
  <text x="450" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">下層板車</text>
  <rect x="370" y="182.9" width="160" height="10" fill="#5b9bd5" stroke="#2e6da4" stroke-width="1.2"/>
  <rect x="377" y="192.9" width="12" height="78" fill="#8fb8dd" stroke="#2e6da4" stroke-width="1"/>
  <rect x="511" y="192.9" width="12" height="78" fill="#8fb8dd" stroke="#2e6da4" stroke-width="1"/>
  <line x1="443" y1="264.2" x2="457" y2="276.2" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="457" y1="264.2" x2="443" y2="276.2" stroke="#c0392b" stroke-width="1.6"/>
  <text x="450" y="292" text-anchor="middle" font-size="10.5" fill="#c0392b">prim 原點 z = 0.981</text>
  <text x="370" y="178" font-size="10.5" fill="#2e6da4">承載面 z = 1.072</text>
  <line x1="353" y1="182.9" x2="353" y2="270.2" stroke="#b35c1e" stroke-width="1.4" marker-start="url(#cd)" marker-end="url(#cu)"/>
  <text x="345" y="230" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b35c1e">91 mm</text>

  <!-- comparison box -->
  <rect x="618" y="96" width="182" height="120" rx="10" fill="#f9fbfd" stroke="#ddd"/>
  <text x="634" y="120" font-size="12" fill="#c0392b">prim 原點相減</text>
  <text x="634" y="142" font-size="15" font-weight="bold" fill="#c0392b">6 mm</text>
  <text x="634" y="172" font-size="12" fill="#5a9367">承載面相減</text>
  <text x="634" y="194" font-size="15" font-weight="bold" fill="#5a9367">75 mm</text>

  <text x="70" y="316" font-size="12" fill="#444">原點到功能面的偏移逐物件不同(這裡是 160 vs 91 mm),因為它們本來就是不同高度的零件。</text>
  <text x="70" y="340" font-size="12" fill="#444">拿 prim z 相減去推功能面的高度差,得到的 6 mm 與真值 75 mm 差一個量級,而查詢本身不會報錯。</text>
  <text x="70" y="366" font-size="11.5" fill="#888">同型問題:屬性掛在哪一層。剛體屬性要授權在剛體那一層,碰撞與質量要查子層 —— 名字相近,值不同。</text>
</svg>
