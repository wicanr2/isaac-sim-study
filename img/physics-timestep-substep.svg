<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">連續力學被切成離散步:physics step 與 render frame 是兩條各自等距的時間軸</text>
  <text x="380" y="48" text-anchor="middle" font-size="12" fill="#777">範例:Physics Scene 設 120 steps/s(dt=1/120s),渲染 60 fps → 每個渲染幀對應 2 個物理步</text>

  <!-- Real time axis -->
  <text x="40" y="92" font-size="12" fill="#888">真實時間(wall clock)</text>
  <line x1="40" y1="105" x2="720" y2="105" stroke="#bbb" stroke-width="1.5"/>
  <g stroke="#bbb" stroke-width="1.5">
    <line x1="40"  y1="100" x2="40"  y2="110"/>
    <line x1="230" y1="100" x2="230" y2="110"/>
    <line x1="420" y1="100" x2="420" y2="110"/>
    <line x1="610" y1="100" x2="610" y2="110"/>
  </g>
  <text x="40" y="122" font-size="11" fill="#999">t=0</text>
  <text x="230" y="122" font-size="11" fill="#999">1/60s</text>
  <text x="420" y="122" font-size="11" fill="#999">2/60s</text>
  <text x="610" y="122" font-size="11" fill="#999">3/60s</text>

  <!-- Physics steps -->
  <text x="40" y="168" font-size="12" fill="#b35c1e" font-weight="bold">Physics step(dt = 1/120s,由 Physics Scene 的 Simulation Steps per Second 決定)</text>
  <g>
    <!-- 6 ticks between 0 and 3/60s at 1/120 spacing -->
    <line x1="40"  y1="182" x2="40"  y2="210" stroke="#e8853d" stroke-width="3"/>
    <line x1="135" y1="182" x2="135" y2="210" stroke="#e8853d" stroke-width="3"/>
    <line x1="230" y1="182" x2="230" y2="210" stroke="#e8853d" stroke-width="3"/>
    <line x1="325" y1="182" x2="325" y2="210" stroke="#e8853d" stroke-width="3"/>
    <line x1="420" y1="182" x2="420" y2="210" stroke="#e8853d" stroke-width="3"/>
    <line x1="515" y1="182" x2="515" y2="210" stroke="#e8853d" stroke-width="3"/>
    <line x1="610" y1="182" x2="610" y2="210" stroke="#e8853d" stroke-width="3"/>
  </g>
  <text x="380" y="228" text-anchor="middle" font-size="11" fill="#b35c1e">solver 對每個 dt 積分一次:接觸/關節約束在這個步長內求解</text>

  <!-- Render frames -->
  <text x="40" y="266" font-size="12" fill="#33506b" font-weight="bold">Render frame(60 fps,由 Timecodes per Second 決定畫面播放速率)</text>
  <rect x="40"  y="278" width="190" height="34" rx="6" fill="#f4f7fb" stroke="#5b7fa6" stroke-width="1.5"/>
  <rect x="230" y="278" width="190" height="34" rx="6" fill="#eef3fa" stroke="#5b7fa6" stroke-width="1.5"/>
  <rect x="420" y="278" width="190" height="34" rx="6" fill="#f4f7fb" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="135" y="300" text-anchor="middle" font-size="12" fill="#33506b">frame 1(= 2 個 physics step)</text>
  <text x="325" y="300" text-anchor="middle" font-size="12" fill="#33506b">frame 2</text>
  <text x="515" y="300" text-anchor="middle" font-size="12" fill="#33506b">frame 3</text>

  <!-- connecting lines physics->render grouping -->
  <g stroke="#ccc" stroke-width="1" stroke-dasharray="3,3">
    <line x1="40" y1="210" x2="40" y2="278"/>
    <line x1="230" y1="210" x2="230" y2="278"/>
    <line x1="420" y1="210" x2="420" y2="278"/>
    <line x1="610" y1="210" x2="610" y2="278"/>
  </g>

  <!-- callout box -->
  <rect x="40" y="330" width="670" height="36" rx="8" fill="#fff3e6" stroke="#e8853d" stroke-width="1.5"/>
  <text x="375" y="353" text-anchor="middle" font-size="12" fill="#b35c1e">Stage 裡若沒有 Physics Scene prim,PhysX 用預設值 60 steps/s——兩條軸重合,沒有「多算的物理步」</text>
</svg>
