<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">重啟只重置一份狀態 —— 分歧的表現形式是「成功」,不是「失敗」</text>

  <defs>
    <marker id="sA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#666"/></marker>
    <marker id="sR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b03a2e"/></marker>
  </defs>

  <!-- column headers -->
  <text x="185" y="60" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b">① 正常運轉</text>
  <text x="410" y="60" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a2e">② 只重啟模擬器</text>
  <text x="655" y="60" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a2e">③ 下一輪任務</text>

  <!-- row labels -->
  <text x="20" y="106" font-size="11.5" font-weight="bold" fill="#b35c1e">模擬器</text>
  <text x="20" y="122" font-size="10.5" fill="#b35c1e">物理狀態</text>
  <text x="20" y="206" font-size="11.5" font-weight="bold" fill="#33506b">外部系統</text>
  <text x="20" y="222" font-size="10.5" fill="#33506b">帳面狀態</text>

  <!-- ===== col 1 ===== -->
  <rect x="90" y="76" width="190" height="70" rx="10" fill="#fff3e6" stroke="#e8853d" stroke-width="2"/>
  <text x="185" y="100" text-anchor="middle" font-size="11" fill="#b35c1e">貨物在 A 位</text>
  <rect x="120" y="108" width="50" height="26" rx="4" fill="#e8853d"/>
  <text x="145" y="126" text-anchor="middle" font-size="10" fill="#ffffff">A</text>
  <rect x="200" y="108" width="50" height="26" rx="4" fill="#ffffff" stroke="#e8853d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="225" y="126" text-anchor="middle" font-size="10" fill="#b35c1e">B 空</text>

  <rect x="90" y="176" width="190" height="70" rx="10" fill="#f4f7fb" stroke="#5b7fa6" stroke-width="2"/>
  <text x="185" y="200" text-anchor="middle" font-size="11" fill="#33506b">DB:貨物在 A 位</text>
  <rect x="120" y="208" width="50" height="26" rx="4" fill="#5b7fa6"/>
  <text x="145" y="226" text-anchor="middle" font-size="10" fill="#ffffff">A</text>
  <rect x="200" y="208" width="50" height="26" rx="4" fill="#ffffff" stroke="#5b7fa6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="225" y="226" text-anchor="middle" font-size="10" fill="#33506b">B 空</text>

  <text x="185" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d4f">✅ 兩份一致</text>

  <!-- arrow 1 -->
  <line x1="288" y1="160" x2="312" y2="160" stroke="#666" stroke-width="2.5" marker-end="url(#sA)"/>

  <!-- ===== col 2 ===== -->
  <rect x="320" y="76" width="180" height="70" rx="10" fill="#fff3e6" stroke="#e8853d" stroke-width="2.5"/>
  <text x="410" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#b35c1e">回到 authored 初始值</text>
  <rect x="345" y="108" width="50" height="26" rx="4" fill="#e8853d"/>
  <text x="370" y="126" text-anchor="middle" font-size="10" fill="#ffffff">A</text>
  <rect x="425" y="108" width="50" height="26" rx="4" fill="#ffffff" stroke="#e8853d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="126" text-anchor="middle" font-size="10" fill="#b35c1e">B 空</text>

  <rect x="320" y="176" width="180" height="70" rx="10" fill="#fbe3e0" stroke="#b03a2e" stroke-width="2.5"/>
  <text x="410" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a2e">沒有跟著回去</text>
  <rect x="345" y="208" width="50" height="26" rx="4" fill="#ffffff" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="370" y="226" text-anchor="middle" font-size="10" fill="#b03a2e">A 空</text>
  <rect x="425" y="208" width="50" height="26" rx="4" fill="#b03a2e"/>
  <text x="450" y="226" text-anchor="middle" font-size="10" fill="#ffffff">B</text>

  <text x="410" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a2e">🔴 兩份分歧</text>
  <text x="410" y="290" text-anchor="middle" font-size="10.5" fill="#b03a2e">沒有任何錯誤訊息</text>

  <!-- arrow 2 -->
  <line x1="508" y1="160" x2="532" y2="160" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#sR)"/>

  <!-- ===== col 3 ===== -->
  <rect x="540" y="76" width="230" height="170" rx="10" fill="#fbe3e0" stroke="#b03a2e" stroke-width="2.5"/>
  <text x="655" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a2e">「把貨物從 B 搬到 A」</text>
  <text x="655" y="124" text-anchor="middle" font-size="10.5" fill="#b03a2e">外部系統認為 B 有貨、A 空</text>
  <text x="655" y="142" text-anchor="middle" font-size="10.5" fill="#b03a2e">流程合法地跑完一遍</text>
  <line x1="580" y1="154" x2="730" y2="154" stroke="#b03a2e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="655" y="176" text-anchor="middle" font-size="11" fill="#b03a2e">兩三分鐘就「完成」</text>
  <text x="655" y="196" text-anchor="middle" font-size="11" fill="#b03a2e">機具幾乎沒動</text>
  <text x="655" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a2e">狀態全綠 ✅</text>
  <text x="655" y="238" text-anchor="middle" font-size="10.5" fill="#b03a2e">監控與告警都指不到它</text>

  <text x="655" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a2e">只有量物理位置才會發現</text>

  <!-- ===== rule band ===== -->
  <rect x="20" y="312" width="780" height="70" rx="10" fill="#e7f5ec" stroke="#2e7d4f" stroke-width="2"/>
  <text x="410" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e7d4f">規則:任何模擬器重啟之後、跑正式流程之前,先做一次完整狀態重置</text>
  <text x="410" y="358" text-anchor="middle" font-size="11" fill="#2e7d4f">把兩份狀態都拉回同一個基準。附帶:模擬時鐘也會歸零,下游依賴時間戳的元件(TF 快取、里程計)會看到時間倒退</text>
  <text x="410" y="376" text-anchor="middle" font-size="11" fill="#2e7d4f">所以「重啟模擬器」在操作上必須定義成「連同下游節點鏈一起重啟」——寫進腳本,不是寫進 SOP 文件</text>
</svg>
