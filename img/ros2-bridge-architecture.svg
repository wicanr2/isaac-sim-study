<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arr4b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="#666"/>
    </marker>
  </defs>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">分層橋接:上游只看到標準車輛介面</text>

  <!-- fleet -->
  <rect x="230" y="48" width="300" height="52" rx="10" fill="#f4f7fb" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="380" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b">車隊管理系統</text>
  <text x="380" y="90" text-anchor="middle" font-size="11" fill="#666">派工、車輛狀態——不知道對面是模擬</text>

  <line x1="380" y1="100" x2="380" y2="128" stroke="#666" stroke-width="1.5" marker-end="url(#arr4)" marker-start="url(#arr4b)"/>
  <text x="395" y="118" text-anchor="start" font-size="11" fill="#888">MQTT(標準車輛通訊契約)</text>

  <!-- bridge -->
  <rect x="230" y="132" width="300" height="52" rx="10" fill="#eef6ee" stroke="#5a9367" stroke-width="1.5"/>
  <text x="380" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c6b47">通訊層 bridge(ROS2 節點)</text>
  <text x="380" y="174" text-anchor="middle" font-size="11" fill="#666">講上游 MQTT 契約 ↔ 翻成 ROS2 topic</text>

  <line x1="380" y1="184" x2="380" y2="212" stroke="#666" stroke-width="1.5" marker-end="url(#arr4)" marker-start="url(#arr4b)"/>
  <text x="395" y="202" text-anchor="start" font-size="11" fill="#888">ROS2 topic(任務 / 命令)</text>

  <!-- servo -->
  <rect x="230" y="216" width="300" height="52" rx="10" fill="#eef6ee" stroke="#5a9367" stroke-width="1.5"/>
  <text x="380" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c6b47">執行層 servo(ROS2 節點)</text>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#666">任務 → 軌跡規劃 → 逐點關節命令</text>

  <line x1="380" y1="268" x2="380" y2="296" stroke="#666" stroke-width="1.5" marker-end="url(#arr4)" marker-start="url(#arr4b)"/>
  <text x="395" y="286" text-anchor="start" font-size="11" fill="#888">ROS2 bridge 或 UDP(headless 保險路徑)</text>

  <!-- isaac -->
  <rect x="230" y="300" width="300" height="52" rx="10" fill="#fff3e6" stroke="#e8853d" stroke-width="2"/>
  <text x="380" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#b35c1e">Isaac Sim</text>
  <text x="380" y="342" text-anchor="middle" font-size="11" fill="#b35c1e">articulation 執行、TF / joint states 回報</text>

  <!-- side note -->
  <rect x="555" y="132" width="180" height="136" rx="10" fill="#ffffff" stroke="#ccc" stroke-width="1.2"/>
  <text x="645" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">替換性</text>
  <text x="645" y="177" text-anchor="middle" font-size="11" fill="#777">真車與模擬車</text>
  <text x="645" y="194" text-anchor="middle" font-size="11" fill="#777">走同一套契約,</text>
  <text x="645" y="211" text-anchor="middle" font-size="11" fill="#777">可並存混跑;</text>
  <text x="645" y="233" text-anchor="middle" font-size="11" fill="#777">唯一對齊點:</text>
  <text x="645" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#b35c1e">車輛名稱要一致</text>

  <text x="380" y="382" text-anchor="middle" font-size="11" fill="#888">綠色兩層 = 自行實作的薄轉譯層;上下兩端(車隊系統、Isaac Sim)都不用改</text>
</svg>
