<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">單 client 限制的解法:relay 當唯一 client,媒體伺服器分流</text>

  <!-- isaac -->
  <rect x="30" y="110" width="170" height="90" rx="10" fill="#fff3e6" stroke="#e8853d" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#b35c1e">Isaac Sim</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#b35c1e">livestream :49100</text>
  <text x="115" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#b35c1e">⚠ 只服務一個 peer</text>

  <!-- relay -->
  <rect x="270" y="110" width="180" height="90" rx="10" fill="#eef6ee" stroke="#5a9367" stroke-width="1.5"/>
  <text x="360" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c6b47">relay</text>
  <text x="360" y="158" text-anchor="middle" font-size="11" fill="#666">headless Chromium</text>
  <text x="360" y="175" text-anchor="middle" font-size="11" fill="#666">+ 官方 streaming library</text>
  <text x="360" y="192" text-anchor="middle" font-size="11" fill="#666">軟體解碼,不占 GPU</text>

  <line x1="200" y1="155" x2="267" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arr5)"/>
  <text x="233" y="145" text-anchor="middle" font-size="11" fill="#888">唯一 client</text>

  <!-- mediamtx -->
  <rect x="520" y="110" width="160" height="90" rx="10" fill="#f4f7fb" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="600" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b">mediamtx</text>
  <text x="600" y="160" text-anchor="middle" font-size="11" fill="#666">開源媒體伺服器</text>
  <text x="600" y="178" text-anchor="middle" font-size="11" fill="#666">收 1 路、發 N 路</text>

  <line x1="450" y1="155" x2="517" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arr5)"/>
  <text x="483" y="145" text-anchor="middle" font-size="11" fill="#888">WHIP 推流</text>

  <!-- viewers -->
  <rect x="600" y="238" width="130" height="36" rx="8" fill="#ffffff" stroke="#999"/>
  <text x="665" y="261" text-anchor="middle" font-size="12" fill="#555">瀏覽器 C</text>
  <rect x="440" y="238" width="130" height="36" rx="8" fill="#ffffff" stroke="#999"/>
  <text x="505" y="261" text-anchor="middle" font-size="12" fill="#555">瀏覽器 B</text>
  <rect x="280" y="238" width="130" height="36" rx="8" fill="#ffffff" stroke="#999"/>
  <text x="345" y="261" text-anchor="middle" font-size="12" fill="#555">瀏覽器 A</text>

  <line x1="580" y1="200" x2="360" y2="235" stroke="#666" stroke-width="1.2" marker-end="url(#arr5)"/>
  <line x1="595" y1="200" x2="515" y2="235" stroke="#666" stroke-width="1.2" marker-end="url(#arr5)"/>
  <line x1="630" y1="200" x2="660" y2="235" stroke="#666" stroke-width="1.2" marker-end="url(#arr5)"/>
  <text x="700" y="222" text-anchor="middle" font-size="11" fill="#888">WHEP 拉流 :8889</text>

  <text x="380" y="310" text-anchor="middle" font-size="11" fill="#888">觀看可分流到任意多人;控制(data channel)仍綁在 relay 這一個 peer 上,多人控制要另做仲裁層</text>
</svg>
